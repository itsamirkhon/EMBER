name: Deploy Ember to Lightsail

on:
  push:
  workflow_dispatch:

concurrency:
  group: deploy-lightsail
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint TypeScript
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Run backtest
        # regenerate validation.json from the committed data (skipped if tests.json is absent)
        run: if [ -f public/data/tests.json ]; then npm run backtest; fi

      - name: Build production bundle
        run: npm run build

      - name: Clean old files on Lightsail
        if: success() && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: rm -rf /var/www/ember/*

      - name: Deploy build files to Lightsail via SCP
        if: success() && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          source: "web/dist/*"
          target: "/var/www/ember"
          strip_components: 2
          overwrite: true
