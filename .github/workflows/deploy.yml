name: Deploy EMBER static site to Lightsail

# main is the working Git branch. The current submission app on that branch
# lives in ember-final/ (see the root README). web/ is an older prototype.
# This publishes static assets only; live AI needs a separately managed API.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-lightsail
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ember-final

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint TypeScript
        run: npm run lint

      - name: Run core and API tests
        run: npm test

      - name: Test the 3D intro evidence gate
        run: npm run test:intro

      - name: Build production bundle
        run: npm run build

      - name: Validate the complete static submission
        run: |
          set -eu
          test -s dist/index.html
          test -s dist/intro.html
          test -s dist/data/compact.json
          test -s dist/data/ask_answers.json
          test -s dist/data/trust.json
          test -s dist/data/corpus_v2.json
          test -s dist/data/chunks_index.json
          test -d dist/assets
          find dist/assets -type f | grep -q .
          test ! -e dist/.env
          printf '%s\n' "${{ github.sha }}" > dist/ember-version.txt

      # Never wipe the live site before transfer. Copy a complete release to
      # a unique staging directory so a failed SCP leaves production intact.
      - name: Stage complete build on Lightsail
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          source: "ember-final/dist/*"
          target: "/tmp/ember-stage-${{ github.run_id }}-${{ github.run_attempt }}"
          strip_components: 2
          overwrite: true

      - name: Verify staged release and promote with rollback
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            set -eu
            stage="/tmp/ember-stage-${{ github.run_id }}-${{ github.run_attempt }}"
            live="/var/www/ember"
            backup="/tmp/ember-backup-${{ github.run_id }}-${{ github.run_attempt }}"

            test -s "$stage/index.html"
            test -s "$stage/intro.html"
            test -s "$stage/data/compact.json"
            test -s "$stage/data/ask_answers.json"
            test -s "$stage/ember-version.txt"
            test -d "$stage/assets"
            command -v rsync >/dev/null 2>&1 || {
              echo "rsync is required on Lightsail; live files not changed" >&2
              exit 1
            }

            mkdir -p "$live" "$backup"
            rsync -a "$live/" "$backup/"
            if rsync -a --delete "$stage/" "$live/"; then
              echo "Published EMBER commit $(cat "$live/ember-version.txt")"
              rm -rf -- "$stage" "$backup"
            else
              echo "Promotion failed; restoring previous files" >&2
              rsync -a --delete "$backup/" "$live/"
              exit 1
            fi
